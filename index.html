<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <!-- ✏️ 1. 브라우저 탭에 보이는 제목 -->
  <title>Yumekk</title>
  <meta name="description" content="꿈일기.">

  <style>
    /* 🔤 내 도트 글꼴 (dunggeunmo.woff 파일을 index.html 과 같은 곳에 올려 두세요) */
    @font-face {
      font-family: "DungGeunMo";
      src: url("dunggeunmo.woff") format("woff");
      font-display: swap;
    }

    /* 🎨 색상은 여기서 한 번에 바꿀 수 있어요 */
    :root {
      --night: #1b0c10;  /* 가장 어두운 바탕 */
      --wine:  #4a1218;  /* 진한 붉은색 */
      --red:   #b3261e;  /* 붉은색 */
      --sand:  #d9c6a5;  /* 베이지 */
      --paper: #efe3cc;  /* 밝은 베이지 */
      --ink:   #241012;  /* 글자색 */
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      color: var(--paper);
      font-family: "DungGeunMo", monospace;
      font-size: 16px;
      line-height: 1.9;
      background:
        radial-gradient(52rem 30rem at 50% -8%, rgba(179, 38, 30, .38), transparent 65%),
        var(--night);
    }
    body.editing { padding-bottom: 340px; }

    main {
      max-width: 820px;
      margin: 0 auto;
      padding: 56px 28px 96px;
    }

    h1, h2 {
      font-family: "DungGeunMo", monospace;
      font-weight: 400;
      line-height: 1.4;
      margin: 0;
    }
    h1 { font-size: 32px; color: var(--wine); }
    h2 { font-size: 32px; margin-bottom: 16px; }
    @media (min-width: 720px) { h1 { font-size: 48px; } }

    p { margin: 0 0 16px; }
    p:last-child { margin-bottom: 0; }
    ul { margin: 0; padding-left: 1.4em; }
    li { margin-bottom: 6px; }

    a { color: var(--red); text-underline-offset: 4px; }
    a:hover { text-decoration-thickness: 3px; }
    a:focus-visible, iframe:focus-visible, button:focus-visible {
      outline: 3px solid var(--red);
      outline-offset: 3px;
    }

    /* ---------- 대화창 (RPG 게임의 글상자처럼) ---------- */
    .win {
      margin-top: 64px;
      padding: 28px;
      background: var(--paper);
      color: var(--ink);
      border: 4px solid var(--ink);
      box-shadow: 0 0 0 4px var(--red), 10px 10px 0 4px var(--wine);
    }
    .win h2 { color: var(--red); }
    .hero { margin-top: 8px; }
    .tagline { margin-top: 16px; }

    /* ---------- 사진 캔버스 ---------- */
    .gallery h2 { color: var(--sand); }

    .stage {
      position: relative;
      /* ✏️ 캔버스 모양: 가로 / 세로 비율. 사진이 많으면 세로를 늘리세요 (예: 4 / 6) */
      aspect-ratio: 4 / 5;
      overflow: hidden;
      border: 4px solid var(--ink);
      box-shadow: 0 0 0 4px var(--red), 10px 10px 0 4px var(--wine);
      background:
        radial-gradient(circle at 50% 50%, transparent 40%, rgba(0, 0, 0, .55)),
        repeating-conic-gradient(#3a0e14 0% 25%, #4a1218 0% 50%) 0 0 / 16px 16px;
    }

    .photo {
      position: absolute;
      margin: 0;
      border: 4px solid var(--paper);
      background: var(--paper);
      box-shadow: 6px 6px 0 var(--red);
    }
    .photo img {
      display: block;
      width: 100%;
      height: auto;
      filter: sepia(.25) saturate(.9) contrast(1.05);
    }
    /* 사진 파일을 아직 못 찾을 때 보이는 빈 칸 */
    .photo.missing {
      aspect-ratio: 3 / 4;
      display: grid;
      place-items: center;
      padding: 8px;
      text-align: center;
      font-size: 16px;
      line-height: 1.5;
      color: var(--sand);
      background: var(--wine);
      border-style: dashed;
      word-break: break-all;
    }
    .photo.missing img { display: none; }
    .photo.missing::after { content: attr(data-src) " 파일을 올려 주세요"; }

    /* ---------- 편집 모드 (주소 끝에 ?edit 를 붙였을 때만) ---------- */
    .editing .photo { cursor: grab; touch-action: none; }
    .photo.selected { outline: 3px dashed var(--paper); outline-offset: 6px; }
    .handle {
      display: none;
      position: absolute;
      right: -12px;
      bottom: -12px;
      width: 22px;
      height: 22px;
      background: var(--paper);
      border: 3px solid var(--ink);
      cursor: nwse-resize;
    }
    .editing .photo.selected .handle { display: block; }

    .panel {
      position: fixed;
      left: 0; right: 0; bottom: 0;
      z-index: 10;
      max-height: 46vh;
      overflow: auto;
      padding: 12px 16px 16px;
      font-size: 16px;
      line-height: 1.6;
      background: var(--night);
      color: var(--paper);
      border-top: 4px solid var(--red);
    }
    .panel p { margin: 0 0 10px; }
    .panel .row { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 10px; }
    .panel button {
      font: inherit;
      padding: 6px 12px;
      color: var(--ink);
      background: var(--paper);
      border: 3px solid var(--ink);
      box-shadow: 3px 3px 0 var(--red);
      cursor: pointer;
    }
    .panel textarea {
      width: 100%;
      height: 120px;
      font: 13px/1.5 monospace;
      color: var(--ink);
      background: var(--paper);
      border: 3px solid var(--ink);
    }

    /* ---------- 음악 (오래된 TV) ---------- */
    .music h2 { color: var(--sand); }
    .tv {
      padding: 22px;
      background: #14090b;
      border: 4px solid var(--sand);
      border-radius: 28px;
      box-shadow: 0 0 0 4px var(--red), 10px 10px 0 4px var(--wine);
    }
    .screen {
      position: relative;
      aspect-ratio: 16 / 9;
      overflow: hidden;
      border-radius: 14px;
      background: #000;
    }
    .screen iframe {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      border: 0;
    }
    /* 화면 위에 옅은 가로줄 */
    .screen::after {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      background: repeating-linear-gradient(transparent 0 2px, rgba(0, 0, 0, .16) 2px 3px);
    }

    footer {
      margin-top: 72px;
      color: var(--sand);
      font-size: 16px;
    }
  </style>
</head>

<body>
  <main>

    <!-- ✏️ 2. 이름과 한 줄 소개 -->
    <header class="win hero">
      <h1>불을 켜보세요 외쳐보는 겁니다<br>아, 이상해</h1>
      <p class="tagline">만나서 반가워요</p>
    </header>

    <!-- ✏️ 3. 자기소개 (자유롭게 고쳐 쓰세요) -->
    <section class="win">
      <h2>저는</h2>
      <p>
        성인 여성.
        2형 조울증이 있어요.
        얕고 넓게 좋아하는 것들이 많아요.
      </p>
      
    </section>

    <!-- ✏️ 4. 관심사 -->
    <section class="win">
      <h2>좋아해요</h2>
      <ul>
        <li>혼자 놀기</li>
        <li>불교 오컬트 타로 명상</li>
        <li>쯔꾸르 게임</li>
      </ul>
    </section>

    <!-- ✏️ 5. 사진: 아래 스크립트의 PHOTOS 목록에서 사진을 추가하고 위치를 정해요 -->
    <section class="gallery" style="margin-top:64px">
      <h2>사진</h2>
      <div class="stage" id="stage"></div>
    </section>

    <!-- ✏️ 6. 유튜브 플레이리스트: PLAYLIST_ID 를 내 재생목록 ID 로 바꾸세요 -->
    <section class="music" style="margin-top:64px">
      <h2>요즘 듣는 음악</h2>
      <div class="tv">
        <div class="screen">
          <iframe
            src="https://www.youtube.com/embed/videoseries?list=PLAYLIST_ID"
            title="내 플레이리스트"
            loading="lazy"
            allow="accelerometer; encrypted-media; picture-in-picture"
            allowfullscreen></iframe>
        </div>
      </div>
    </section>

  </main>

  <script>
    /* ==========================================================
       📷 사진 목록
       - 한 줄이 사진 한 장이에요. 줄을 복사해서 붙이면 사진이 늘어나요.
       - src: 사진 파일 이름 (영어 소문자, 이 파일과 같은 곳에 올려 두기)
       - x, y: 캔버스 안에서의 위치 (0~100, 왼쪽 위가 0, 0)
       - w: 사진 너비 (캔버스 너비의 몇 %인지)
       - rot: 기울기 (도 단위, 음수면 반대쪽으로)
       - 아래 목록은 주소 끝에 ?edit 를 붙인 편집 모드에서
         사진을 끌어 옮긴 뒤 복사한 내용으로 통째로 바꿀 수 있어요.
       ========================================================== */
    const PHOTOS = [
      { src: "photo1.jpg", x: 6, y: 5, w: 40, rot: -3 },
      { src: "photo2.jpg", x: 52, y: 22, w: 38, rot: 2 },
      { src: "photo3.jpg", x: 14, y: 52, w: 34, rot: 1 },
    ];
    /* ========================================================== */

    const stage = document.getElementById("stage");
    const editing = new URLSearchParams(location.search).has("edit");
    let selected = -1, mode = null, start = null, out = null;

    const round1 = n => Math.round(n * 10) / 10;
    const clamp = (n, a, b) => Math.min(b, Math.max(a, n));

    function place(el, p) {
      el.style.left = p.x + "%";
      el.style.top = p.y + "%";
      el.style.width = p.w + "%";
      el.style.transform = "rotate(" + p.rot + "deg)";
    }

    function build() {
      stage.querySelectorAll(".photo").forEach(n => n.remove());
      PHOTOS.forEach((p, i) => {
        const f = document.createElement("figure");
        f.className = "photo";
        f.dataset.i = i;
        f.dataset.src = p.src;
        const img = new Image();
        img.src = p.src;
        img.alt = p.alt || "";
        img.draggable = false;
        img.addEventListener("error", () => f.classList.add("missing"));
        f.appendChild(img);
        if (editing) {
          const h = document.createElement("span");
          h.className = "handle";
          f.appendChild(h);
        }
        if (i === selected) f.classList.add("selected");
        place(f, p);
        stage.appendChild(f);
      });
    }

    build();

    if (editing) {
      document.body.classList.add("editing");

      const panel = document.createElement("div");
      panel.className = "panel";
      panel.innerHTML =
        '<p>편집 모드예요. 사진을 끌어서 옮기고, 선택한 사진의 오른쪽 아래 네모를 끌면 크기가 바뀌어요. ' +
        '다 끝나면 아래 글자를 복사해서 index.html 의 PHOTOS 부분에 통째로 붙여 넣으세요.</p>' +
        '<div class="row">' +
        '<button type="button" id="rotL">↺ 왼쪽으로 기울이기</button>' +
        '<button type="button" id="rotR">↻ 오른쪽으로 기울이기</button>' +
        '<button type="button" id="front">맨 앞으로</button>' +
        '<button type="button" id="copy">복사하기</button>' +
        '</div>' +
        '<textarea id="out" readonly></textarea>';
      document.body.appendChild(panel);
      out = panel.querySelector("#out");

      const current = () => stage.querySelector('.photo[data-i="' + selected + '"]');

      function output() {
        out.value =
          "const PHOTOS = [\n" +
          PHOTOS.map(p =>
            '  { src: "' + p.src + '", x: ' + p.x + ", y: " + p.y + ", w: " + p.w + ", rot: " + p.rot + " },"
          ).join("\n") +
          "\n];";
      }
      output();

      function select(i) {
        selected = i;
        stage.querySelectorAll(".photo").forEach(f =>
          f.classList.toggle("selected", +f.dataset.i === i));
      }

      stage.addEventListener("pointerdown", e => {
        const f = e.target.closest(".photo");
        if (!f) { select(-1); return; }
        select(+f.dataset.i);
        mode = e.target.classList.contains("handle") ? "resize" : "move";
        const p = PHOTOS[selected];
        start = { x: e.clientX, y: e.clientY, px: p.x, py: p.y, pw: p.w, rect: stage.getBoundingClientRect() };
        f.setPointerCapture(e.pointerId);
        e.preventDefault();
      });

      stage.addEventListener("pointermove", e => {
        if (!mode || selected < 0) return;
        const p = PHOTOS[selected];
        const dx = (e.clientX - start.x) / start.rect.width * 100;
        const dy = (e.clientY - start.y) / start.rect.height * 100;
        if (mode === "move") {
          p.x = round1(clamp(start.px + dx, 0, 95));
          p.y = round1(clamp(start.py + dy, 0, 95));
        } else {
          p.w = round1(clamp(start.pw + dx, 8, 100));
        }
        place(current(), p);
        output();
      });

      const stop = () => { mode = null; };
      stage.addEventListener("pointerup", stop);
      stage.addEventListener("pointercancel", stop);

      function rotate(d) {
        if (selected < 0) return;
        PHOTOS[selected].rot += d;
        place(current(), PHOTOS[selected]);
        output();
      }
      panel.querySelector("#rotL").addEventListener("click", () => rotate(-3));
      panel.querySelector("#rotR").addEventListener("click", () => rotate(3));

      panel.querySelector("#front").addEventListener("click", () => {
        if (selected < 0) return;
        PHOTOS.push(PHOTOS.splice(selected, 1)[0]);
        selected = PHOTOS.length - 1;
        build();
        output();
      });

      const copyBtn = panel.querySelector("#copy");
      copyBtn.addEventListener("click", () => {
        const done = () => {
          copyBtn.textContent = "복사됐어요!";
          setTimeout(() => { copyBtn.textContent = "복사하기"; }, 1500);
        };
        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(out.value).then(done, () => { out.select(); document.execCommand("copy"); done(); });
        } else {
          out.select();
          document.execCommand("copy");
          done();
        }
      });
    }
  </script>
</body>
</html>
